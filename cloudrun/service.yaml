# Qwen3.8-27B in NVFP4 on half an NVIDIA RTX PRO 6000, served by SGLang with DFlash 2 block
# drafting. Applied with `gcloud alpha run services replace`.
#
# `services replace` is used rather than `run deploy --args=...` because that flag splits on
# commas and several values here contain them. It also resets anything set imperatively with
# `services update`, which is how a min-instances setting was lost once.
#
# Reachable from the internet, gated by SGLang's own bearer token. That is a deliberate choice
# and a different risk from the llama.cpp box compromised in August: SGLang runs no server-side
# tools, so there is no exec_shell_command behind this door - a caller with the key can spend
# GPU and read the model, nothing else.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qwen38-27b-nvfp4-dflash2
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        # Load-bearing, not a convenience: this is the only backend dataroom has, and a cold
        # start is ~10 minutes (23GB of weights, then torch.compile, then autotune).
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
        # Mandatory in this preview; without it the deploy hangs or fails on quota.
        run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
    spec:
      containerConcurrency: 4
      timeoutSeconds: 600
      serviceAccountName: SERVICE_ACCOUNT@PROJECT.iam.gserviceaccount.com
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-rtx-pro-6000
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/sglang/qwen38-dflash2:v1
          ports:
            - name: http1
              containerPort: 8080
          # Images are preprocessed on the GPU, and the input is bounded so that the
          # allocation is bounded with it. Qwen2-VL's processor resizes rather than rejects:
          # aspect ratio is preserved and dimensions round to patch multiples, so this is a
          # ceiling on cost and not a refusal of large images. This checkpoint has patch_size 16
          # and merge_size 2, so a token covers 32x32 = 1024 pixels and 1,048,576 pixels is
          # exactly 1,024 image tokens, whatever arrives. Measured: 2048x2048 goes 4,096 -> 1,024
          # tokens and 3000x2000 goes 5,828 -> 1,014, both in ~0.6s, while anything already under
          # the cap is untouched.
          #
          # The kwarg is `size`, not `max_pixels`, and the wrong one fails silently. This
          # processor's config carries size: {longest_edge: 16777216, shortest_edge: 65536} and no
          # min_pixels/max_pixels at all, so --mm-process-config '{"image":{"max_pixels":...}}'
          # was accepted, echoed back by /get_server_info verbatim, and ignored - the 3000x2000
          # image still produced 5,828 tokens. longest_edge is an area in pixels here, not an edge
          # length, which is why the untouched default is a 16,384-token ceiling.
          #
          # Unbounded was the bug, and shrinking mem-fraction-static was the wrong instrument for
          # it: 0.90 failed needing 352 MiB and 0.85 failed needing 392 MiB with 154 MiB free,
          # because the fraction is a constant and the allocation is a function of the input, so
          # it can always be outgrown. 0.80 is headroom for a bounded allocation rather than an
          # attempt to outrun an unbounded one. It costs 45,824 tokens of KV pool
          # (max_req_input_len 185,984 -> 140,160) and no decode: 110.9 tok/s against 111.0.
          #
          # --max-mamba-cache-size 5 is the floor, and on purpose. The hybrid state cache is
          # sized in units of mamba_ratio, which is 5 for this model, so slots must be >= 5 per
          # request: 4 refuses to start with "resulting max_num_reqs=0". SGLang auto-picks 8, but
          # floor(8/5) and floor(5/5) are both 1 request, so the extra three slots buy no
          # concurrency - only radix buffer. Dropping them is worth +10,738 tokens of context
          # (140,160 -> 150,898 with the BF16 drafter; 206,492 once the drafter went NVFP4)
          # and costs nothing measurable: prefix reuse stays at 13,504 of
          # 13,552 tokens and decode is 113.2 tok/s against 110.9.
          #
          # Only ssm_state scales with slots (1.27 -> 0.84 GB); intermediate_ssm_state_cache is a
          # fixed 2.25 GB, which is why 8 -> 5 returns 0.43 GB and not 1.34.
          #
          # RAISING --max-running-requests REQUIRES RAISING THIS IN STEP or the server won't boot.
          #
          # Run through a shell so "$SGLANG_API_KEY" expands. Knative does NOT substitute
          # $(VAR) in args: passing --api-key='$(SGLANG_API_KEY)' handed SGLang that literal
          # string and made it the password. The key stays in Secret Manager either way; this
          # file never contains it.
          command:
            - /bin/sh
            - -c
          args:
            - >-
              exec python3 -m sglang.launch_server
              --model-path=RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
              --served-model-name=Qwen3.8-27B-NVFP4
              --trust-remote-code
              --host=0.0.0.0
              --port=8080
              --mem-fraction-static=0.80
              --context-length=262144
              --kv-cache-dtype=fp8_e4m3
              --attention-backend=flashinfer
              --chunked-prefill-size=4096
              --max-prefill-tokens=4096
              --max-running-requests=1
              --speculative-algorithm=DFLASH
              --speculative-draft-model-path=maurienne-ai/Qwen3.8-27B-DFlash2-NVFP4-RTNcal
              --speculative-num-draft-tokens=8
              --speculative-draft-model-quantization=modelopt_fp4
              --speculative-draft-attention-backend=flashinfer
              --min-free-slots-delay=1
              --max-mamba-cache-size=5
              --reasoning-parser=qwen3
              --tool-call-parser=qwen3_coder
              --sampling-defaults=model
              --enable-metrics
              --mm-process-config '{"image":{"size":{"longest_edge":1048576,"shortest_edge":65536}}}'
              --api-key "$SGLANG_API_KEY"
          env:
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: SGLANG_API_KEY
                  key: latest
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: '1'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: HF_TOKEN
                  key: latest
          resources:
            limits:
              cpu: '16'
              memory: 64Gi
              nvidia.com/gpu: '0.5'
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 60
            failureThreshold: 20
            timeoutSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
