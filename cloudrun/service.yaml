# Qwen3.8-27B in NVFP4 on half an NVIDIA RTX PRO 6000, served by SGLang with DFlash 2 block
# drafting. Applied with `gcloud alpha run services replace`.
#
# `services replace` is used rather than `run deploy --args=...` because that flag splits on
# commas and several values here contain them. It also resets anything set imperatively with
# `services update`, which is how a min-instances setting was lost once.
#
# Reachable from the internet, gated by SGLang's own bearer token. That is a deliberate choice
# and a different risk from the llama.cpp box compromised in August: SGLang runs no server-side
# tools, so there is no exec_shell_command behind this door - a caller with the key can spend
# GPU and read the model, nothing else.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qwen38-27b-nvfp4-dflash2
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        # Load-bearing, not a convenience: this is the only backend dataroom has, and a cold
        # start is ~10 minutes (23GB of weights, then torch.compile, then autotune).
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
        # Mandatory in this preview; without it the deploy hangs or fails on quota.
        run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
    spec:
      containerConcurrency: 4
      timeoutSeconds: 600
      serviceAccountName: SERVICE_ACCOUNT@PROJECT.iam.gserviceaccount.com
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-rtx-pro-6000
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/sglang/qwen38-dflash2:v1
          ports:
            - name: http1
              containerPort: 8080
          # --disable-fast-image-processor moves image preprocessing off the GPU. The "fast"
          # processor is the torchvision one and it allocates on the device, in the API process,
          # outside the engine's static budget - so shrinking that budget did not reliably help:
          # a 1024x1024 image failed at 0.90 needing 352 MiB, and again at 0.85 needing 392 MiB
          # with 154 MiB free. The slow path preprocesses on CPU and asks the GPU for nothing.
          #
          # mem-fraction-static is 0.85, not the 0.90 the full-card recipe uses. This model is
          # a VLM and the Qwen2-VL image preprocessor runs on the GPU in the API process, which
          # is not part of the engine's static budget. At 0.90 the engine took 42.88 of 47.64
          # GiB and left 390 MiB, so a real photograph died in preprocess with "Tried to
          # allocate 352.00 MiB" while a 128x128 test image had passed. The KV pool is smaller
          # for it; the window follows automatically, because the harness sizes itself from
          # max_req_input_len rather than from a number written down twice.
          #
          # Run through a shell so "$SGLANG_API_KEY" expands. Knative does NOT substitute
          # $(VAR) in args: passing --api-key='$(SGLANG_API_KEY)' handed SGLang that literal
          # string and made it the password. The key stays in Secret Manager either way; this
          # file never contains it.
          command:
            - /bin/sh
            - -c
          args:
            - >-
              exec python3 -m sglang.launch_server
              --model-path=RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
              --served-model-name=Qwen3.8-27B-NVFP4
              --trust-remote-code
              --host=0.0.0.0
              --port=8080
              --mem-fraction-static=0.85
              --context-length=262144
              --kv-cache-dtype=fp8_e4m3
              --attention-backend=flashinfer
              --chunked-prefill-size=4096
              --max-prefill-tokens=4096
              --max-running-requests=1
              --speculative-algorithm=DFLASH
              --speculative-draft-model-path=z-lab/Qwen3.8-27B-DFlash2
              --speculative-num-draft-tokens=8
              --speculative-draft-model-quantization=unquant
              --speculative-draft-attention-backend=flashinfer
              --min-free-slots-delay=1
              --reasoning-parser=qwen3
              --tool-call-parser=qwen3_coder
              --sampling-defaults=model
              --enable-metrics
              --disable-fast-image-processor
              --api-key "$SGLANG_API_KEY"
          env:
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: SGLANG_API_KEY
                  key: latest
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: '1'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: HF_TOKEN
                  key: latest
          resources:
            limits:
              cpu: '16'
              memory: 64Gi
              nvidia.com/gpu: '0.5'
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 60
            failureThreshold: 20
            timeoutSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
