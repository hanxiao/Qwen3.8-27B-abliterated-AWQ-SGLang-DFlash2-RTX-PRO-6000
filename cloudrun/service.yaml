# Qwen3.8-27B, abliterated (huihui-ai) and quantized to AWQ-INT4 with cyankiwi's recipe
# (quant/), on half an NVIDIA RTX PRO 6000, served by SGLang with DFlash 2 block drafting.
# Applied with `gcloud alpha run services replace`.
#
# `services replace` is used rather than `run deploy --args=...` because that flag splits on
# commas and several values here contain them. It also resets anything set imperatively with
# `services update`, which is how a min-instances setting was lost once.
#
# Reachable from the internet, gated by SGLang's own bearer token. That is a deliberate choice
# and a different risk from the llama.cpp box compromised in August: SGLang runs no server-side
# tools, so there is no exec_shell_command behind this door - a caller with the key can spend
# GPU and read the model, nothing else.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qwen38-27b-nvfp4-dflash2
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    # The 64 GiB memory limit below is refused unless the service declares the ALPHA launch stage.
    run.googleapis.com/launch-stage: ALPHA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        # Load-bearing, not a convenience: this is the only backend dataroom has, and a cold
        # start is ~12 minutes (25 GB of weights from the bucket, then autotune and CUDA graphs).
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
        # Mandatory in this preview; without it the deploy hangs or fails on quota.
        run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
    spec:
      # Two requests per slot, as before (4 slots): requests 5 to 8 queue inside SGLang, where the
      # prefix cache and the admission order live, and Cloud Run returns 429 only beyond 8.
      containerConcurrency: 8
      # Cloud Run's maximum. A request is one model turn, and an agent turn that writes a long
      # file in one tool call runs for many minutes; at 600 Cloud Run cut such turns off.
      timeoutSeconds: 3600
      serviceAccountName: SERVICE_ACCOUNT@PROJECT.iam.gserviceaccount.com
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-rtx-pro-6000
      containers:
        # lmsysorg/sglang:v0.5.22 with five patches and Granian, built by docker/build.sh (see the
        # Dockerfile). DFlash 2 is upstream since v0.5.19; the old overlay image had sglang#37817
        # (stale GDN state on prefix-cache hits). The deployed revision pins this tag by digest,
        # sha256:28876b9aa7a67ba02dcee0bedc3b41954668c1978f64832f5c289424438f8956.
        - image: REGION-docker.pkg.dev/PROJECT/sglang/qwen38-sglang:v0.5.22-patched6-arh
          # h2c: Cloud Run speaks HTTP/2 to the container (served by Granian, --enable-http2), so a
          # client that hangs up reaches SGLang as a stream reset and its request is aborted within
          # a second. Over HTTP/1.1 the front end kept the backend request alive, and a stopped run
          # held its slot until its answer finished. Clients keep using HTTP/1.1 or HTTP/2.
          ports:
            - name: h2c
              containerPort: 8080
          # Images are preprocessed on the GPU, and the input is bounded so that the
          # allocation is bounded with it. Qwen2-VL's processor resizes rather than rejects:
          # aspect ratio is preserved and dimensions round to patch multiples, so this is a
          # ceiling on cost and not a refusal of large images. This checkpoint has patch_size 16
          # and merge_size 2, so a token covers 32x32 = 1024 pixels and 1,048,576 pixels is
          # exactly 1,024 image tokens, whatever arrives. Measured: 2048x2048 goes 4,096 -> 1,024
          # tokens and 3000x2000 goes 5,828 -> 1,014, both in ~0.6s, while anything already under
          # the cap is untouched.
          #
          # The kwarg is `size`, not `max_pixels`, and the wrong one fails silently. This
          # processor's config carries size: {longest_edge: 16777216, shortest_edge: 65536} and no
          # min_pixels/max_pixels at all, so --mm-process-config '{"image":{"max_pixels":...}}'
          # was accepted, echoed back by /get_server_info verbatim, and ignored - the 3000x2000
          # image still produced 5,828 tokens. longest_edge is an area in pixels here, not an edge
          # length, which is why the untouched default is a 16,384-token ceiling.
          #
          # Unbounded was the bug, and shrinking mem-fraction-static was the wrong instrument for
          # it: 0.90 failed needing 352 MiB and 0.85 failed needing 392 MiB with 154 MiB free,
          # because the fraction is a constant and the allocation is a function of the input, so
          # it can always be outgrown. 0.80 is headroom for a bounded allocation rather than an
          # attempt to outrun an unbounded one. It costs 45,824 tokens of KV pool
          # (max_req_input_len 185,984 -> 140,160) and no decode: 110.9 tok/s against 111.0.
          #
          # 0.79 rather than 0.80 since the move to four slots: at 0.80 the four-slot config left
          # 5.00 GB after startup, and one /generate with full-prompt top-20 input logprobs
          # (scripts/fid.py) asked for 1.89 GiB, hit CUDA OOM and killed the server. At 0.79 this
          # revision has 5.49 GB left after startup (available_gpu_mem), more than the two-slot
          # revision's 5.21, and the pool is 266,083 tokens (max_req_input_len 262,138).
          #
          # --max-mamba-cache-size counts recurrent-state slots, five per running request on this
          # model (three base, two for prefix-cache tracking); sglang#43204 kills the engine when
          # every slot is taken and locked. 22 = 5 x 4 requests + 2 spare: 3.34 GB of fp32 state.
          # The state stays fp32 (ReplaySSM sets it): greedy output is byte-identical to
          # the two-slot config on 104/104 prompts. bfloat16 state would fit eight slots but
          # changes greedy text (41/104 identical); see the README.
          #
          # --cuda-graph-max-bs-decode=4 captures decode and verify graphs for batch sizes 1-4,
          # one per slot count.
          #
          # --enable-linear-replayssm-spec, with docker/replayssm_dflash.py: verification keeps
          # compact replay records instead of the recurrent state at each of the 8 drafted
          # positions, and replays the accepted prefix into the checkpoint afterwards. It drops the
          # 3.38 GB intermediate_ssm_state_cache (pool 237,384 -> 321,526 tokens at 10 slots) and
          # the state writes of every verify step: decode +7.5% greedy, +6.8% sampled, +6% at 34k
          # and +14% at 115k tokens of context. Not bit-exact with the per-position states: greedy
          # text differs about as much as between SGLang v0.5.20 and v0.5.22 (10 vs 9 of 24
          # answers identical), and every quality check is unchanged.
          #
          # --speculative-use-block-verification (arXiv 2403.10444): after an early rejection it can
          # still accept a longer prefix, with a correction that keeps the target distribution. It
          # acts on sampled requests only: 3.39 -> 3.56 tokens per verify step, decode +4.2%.
          #
          # RAISING --max-running-requests REQUIRES RAISING --max-mamba-cache-size IN STEP or the
          # server won't boot.
          #
          # The target and the drafter come from the bucket (cloudrun/gcsdl.py, parallel ranged
          # downloads to local disk) before SGLang starts. Loading the target straight off the
          # gcsfuse mount took 849 s; the mount is only how gcsdl.py itself arrives. The service
          # account needs read access to the bucket.
          #
          # Run through a shell so "$SGLANG_API_KEY" expands. Knative does NOT substitute
          # $(VAR) in args: passing --api-key='$(SGLANG_API_KEY)' handed SGLang that literal
          # string and made it the password. The key stays in Secret Manager either way; this
          # file never contains it.
          command:
            - /bin/sh
            - -c
          args:
            - >-
              pip install -q 'google-cloud-storage==3.17.1' &&
              python3 /gcs/gcsdl.py BUCKET huihui-awq/out=/tmp/model dflash2=/tmp/dflash2 &&
              exec python3 -m sglang.launch_server
              --model-path=/tmp/model
              --served-model-name=Qwen3.8-27B-abliterated-AWQ-INT4
              --trust-remote-code
              --host=0.0.0.0
              --port=8080
              --mem-fraction-static=0.79
              --context-length=262144
              --kv-cache-dtype=fp8_e4m3
              --attention-backend=flashinfer
              --linear-attn-prefill-backend=flashinfer
              --chunked-prefill-size=4096
              --max-prefill-tokens=4096
              --max-running-requests=4
              --speculative-algorithm=DFLASH
              --speculative-draft-model-path=/tmp/dflash2
              --speculative-num-draft-tokens=8
              --speculative-draft-model-quantization=fp8
              --speculative-draft-attention-backend=flashinfer
              --min-free-slots-delay=1
              --max-mamba-cache-size=22
              --cuda-graph-max-bs-decode=4
              --reasoning-parser=qwen3
              --tool-call-parser=qwen3_coder
              --sampling-defaults=model
              --enable-metrics
              --mm-process-config '{"image":{"size":{"longest_edge":1048576,"shortest_edge":65536}}}'
              --grammar-backend=none
              --prefill-decode-interval=40
              --enable-cache-report
              --speculative-use-block-verification
              --enable-linear-replayssm-spec
              --enable-http2
              --api-key "$SGLANG_API_KEY"
          env:
            # DFlash scores its draft candidates with an int8 copy of lm_head (docker/dflash_qhead.py)
            # instead of reading the 2.54 GB BF16 head a second time each step; verification keeps
            # the BF16 head. Decode +6%; 1.27 GB, taken from the memory left after the pools.
            - name: SGLANG_DFLASH_DRAFT_HEAD
              value: int8
            # Tile of the int8 draft-head kernel (BN, BK, warps, stages). Above 32 draft rows per
            # verify batch (slots x block) the kernel tiles BM=64, and the default 128,256,8,3 then
            # needs 131,072 B of shared memory against this MIG partition's 101,376: Triton
            # OutOfResources at startup. 128,128,8,2 fits in 98,304 B. This revision has at most
            # 4 x 8 = 32 rows; it carries the setting from the configuration it was measured with.
            - name: SGLANG_DFLASH_DRAFT_HEAD_CFG
              value: '128,128,8,2'
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: SGLANG_API_KEY
                  key: latest
            # Carried over from earlier revisions. The model and the drafter load from local disk
            # (gcsdl.py), so serving does not download from Hugging Face.
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: '1'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: HF_TOKEN
                  key: latest
          volumeMounts:
            - name: weights
              mountPath: /gcs
              readOnly: true
          resources:
            limits:
              cpu: '16'
              memory: 64Gi
              nvidia.com/gpu: '0.5'
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 60
            failureThreshold: 20
            timeoutSeconds: 30
      volumes:
        - name: weights
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: BUCKET
  traffic:
    - percent: 100
      latestRevision: true
